<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fa"><title>OpenPinMap · 引脚图工作台</title><meta name="description" content="在线编辑开发板引脚图，实时预览、透明 PNG 导出与 JSON 配置保存。"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header">
 <a class="brand" href="#" aria-label="OpenPinMap"><span class="brand-mark"><i></i><i></i><i></i></span><span>Open<span class="brand-light">PinMap</span><small>引脚图工作台</small></span></a>
 <div class="header-actions"><button id="import-project" class="button">打开项目</button><button id="save-project" class="button">保存项目</button><button id="export-png" class="button primary"><span>↓</span> 导出 PNG</button></div>
</header>
<div class="workspace-bar"><div class="document-title"><span class="file-icon">▧</span><input id="project-name" aria-label="项目名称" value="WT9932S31-TINY"><span class="badge">PINOUT</span></div><div class="document-meta"><span id="pin-total">42 个引脚</span><span class="separator">/</span><span id="output-size">3376 × 5000 px</span><span class="saved-state" id="save-state">已载入 S31 示例</span></div></div>
<main class="workspace">
 <aside class="sidebar">
  <nav class="tabs" aria-label="编辑面板"><button class="tab active" data-tab="material">素材与画布</button><button class="tab" data-tab="pins">引脚配置</button><button class="tab" data-tab="style">标签样式</button></nav>
  <div class="panel active" id="panel-material">
   <section><div class="section-heading"><h2>产品素材</h2></div>
    <button class="upload-card" id="upload-image"><div class="image-thumbnail checker"><img id="source-thumbnail" alt="当前产品素材"></div><span><strong id="source-name">S31-TINY 正面透明底.png</strong><small>更换图片</small><span class="tag" id="alpha-tag">PNG · 透明背景</span></span><span class="upload-arrow">↥</span></button>
    
    <div class="button-row"><button class="button small" id="crop-image">裁去透明边缘</button><button class="button small" id="center-image">居中素材</button></div>
    <div class="field-row"><label>水平位置 X<input id="image-x" type="number" data-state="imageX"></label><label>垂直位置 Y<input id="image-y" type="number" data-state="imageY"></label></div>
    <label class="range-label"><span>素材缩放 <output id="image-scale-value">100%</output></span><input id="image-scale" type="range" min="5" max="250" step="1" data-state="imageScale"></label>
   </section>
   <section><div class="section-heading"><h2>画布设置</h2></div><div class="field-row"><label>宽度 <span>px</span><input id="canvas-width" type="number" min="200" max="8000" data-state="width"></label><label>高度 <span>px</span><input id="canvas-height" type="number" min="200" max="8000" data-state="height"></label></div>
    <label class="field-label">导出背景</label><div class="segmented"><button class="selected" data-bg="transparent"><span class="tiny-checker"></span>透明</button><button data-bg="white"><span class="tiny-white"></span>白色</button><button data-bg="dark"><span class="tiny-dark"></span>深色</button></div>
    
   </section>
   <section><div class="section-heading"><h2>示例</h2></div><button id="load-example" class="example-card"><span class="example-icon">S31</span><span><strong>WT9932S31-TINY</strong><small>42 针 · HDK 2026-09-20</small></span><span>↗</span></button></section>
  </div>
  <div class="panel" id="panel-pins">
   <section><div class="section-heading"><h2>引脚分组</h2><button class="text-button" id="add-group">＋ 添加</button></div><div id="group-tabs" class="group-tabs"></div>
    <div class="field-row group-name-row"><label>分组名称<input id="group-name" type="text" maxlength="32"></label><button id="delete-group" class="button small danger" title="删除当前分组">删除组</button></div>
    <div class="field-row"><label>起点 X<input id="group-x" type="number" step="1"></label><label>起点 Y<input id="group-y" type="number" step="1"></label><label>针脚间距<input id="group-gap" type="number" min="1" max="2000" step="0.1"></label></div>
    <div class="pin-list-heading"><span>名称与颜色</span><button class="text-button" id="reverse-pins">反转顺序 ↕</button></div>
    <div id="pin-list" class="pin-list"></div><button id="add-pin" class="button full-width">＋ 添加引脚</button>
    <details class="batch-editor"><summary>批量编辑名称</summary><textarea id="batch-pins" rows="10" spellcheck="false" aria-label="批量引脚名称"></textarea><button id="apply-batch" class="button small">应用名称</button></details>
   </section>
   <section><button id="import-config" class="button full-width">导入 pins_pic_gen JSON</button></section>
  </div>
  <div class="panel" id="panel-style">
   <section><div class="section-heading"><h2>文字与标签</h2></div><label>字体<select id="font-family" data-state="fontFamily"><option value="Arial">Arial</option><option value="sans-serif">系统无衬线</option><option value="monospace">等宽字体</option></select></label><label class="range-label"><span>字号 <output id="font-size-value">70 px</output></span><input type="range" id="font-size" data-state="fontSize" min="12" max="180" step="1"></label><label class="range-label"><span>圆角程度 <output id="radius-value">100%</output></span><input type="range" id="radius" data-state="radius" min="0" max="100" step="1"></label><label class="toggle-row"><span>显示引线</span><input type="checkbox" id="guides" data-state="guides"></label></section>
   <section><div class="section-heading"><h2>快捷配色</h2><button class="text-button" id="auto-colors">应用到全部引脚</button></div><div class="palette-row"><label><input type="color" id="color-gpio" value="#3498db">GPIO</label><label><input type="color" id="color-power" value="#e74c3c">电源</label><label><input type="color" id="color-ground" value="#2ecc71">GND</label></div></section>
   <section><div class="section-heading"><h2>生成器文件</h2></div><div class="button-row"><button id="export-config" class="button small">导出配置</button><button id="export-base" class="button small">导出底图</button></div></section>
  </div>
 </aside>
 <section class="preview-area" aria-label="引脚图实时预览">
  <div class="preview-toolbar"><div class="preview-label"><span class="live-dot"></span>实时预览<span class="subtle" id="preview-background">透明画布</span></div><div class="preview-tools"><button class="icon-button" id="undo" title="撤销 (Ctrl/⌘ Z)" aria-label="撤销">↶</button><button class="icon-button" id="redo" title="重做" aria-label="重做">↷</button><span class="tool-divider"></span><button class="button small" id="fit">适应画布</button><button class="button small" id="actual">100%</button></div></div>
  <div id="viewport" class="viewport"><div id="canvas-wrap" class="canvas-wrap checker"><canvas id="preview" aria-label="引脚图画布"></canvas></div><div id="drop-overlay" class="drop-overlay"><strong>释放图片，开始标注</strong><span>PNG · JPEG · WebP</span></div></div>
  <div class="preview-bottom"><div></div><div class="zoom-controls"><button id="zoom-out" class="icon-button" aria-label="缩小">−</button><span id="zoom-value">25%</span><button id="zoom-in" class="icon-button" aria-label="放大">＋</button></div></div>
 </section>
</main>
<div id="toast" class="toast" role="status"></div>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="project-file" type="file" accept=".json,application/json" hidden><input id="config-file" type="file" accept=".json,application/json" hidden>
<script src="defaults.js"></script><script src="src/model.js"></script><script src="app.js"></script>
</body></html>
