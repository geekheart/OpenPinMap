<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fa"><title data-i18n="page.title">OpenPinMap · 引脚图工作台</title><meta name="description" content="在线编辑开发板引脚图，A4 画布、拖拽缩放、PNG / SVG / JPG 导出与 JSON 配置保存。" data-i18n-content="page.description"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header">
 <a class="brand" href="#" aria-label="OpenPinMap"><span class="brand-mark"><i></i><i></i><i></i></span><span>Open<span class="brand-light">PinMap</span><small><span data-i18n="brand.subtitle">引脚图工作台</span></small></span></a>
 <div class="header-actions"><div class="header-links"><select id="language-select" data-i18n-aria-label="language.label" aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><a id="github-link" class="github-link" href="https://github.com/geekheart/OpenPinMap" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="github.label" data-i18n-title="github.label" aria-label="在 GitHub 查看 OpenPinMap 源码" title="在 GitHub 查看 OpenPinMap 源码"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.53v-2.07c-3.09.67-3.74-1.31-3.74-1.31-.5-1.29-1.23-1.63-1.23-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.71-1.49-2.47-.28-5.07-1.24-5.07-5.49 0-1.21.43-2.2 1.14-2.98-.11-.28-.49-1.41.11-2.93 0 0 .93-.3 3.05 1.14a10.63 10.63 0 0 1 5.55 0c2.12-1.44 3.05-1.14 3.05-1.14.6 1.52.22 2.65.11 2.93.71.78 1.14 1.77 1.14 2.98 0 4.26-2.6 5.2-5.08 5.48.4.35.76 1.02.76 2.06V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/></svg></a></div><button id="import-project" class="button"><span data-i18n="project.open">打开项目</span></button><button id="save-project" class="button"><span data-i18n="project.save">保存项目</span></button><button id="export-png" class="button primary"><span class="button-icon">↓</span> <span data-i18n="export.image">导出图片</span></button></div>
</header>
<div class="workspace-bar"><div class="document-title"><span class="file-icon">▧</span><input id="project-name" aria-label="项目名称" value="WT9932P4-TINY" data-i18n-aria-label="project.name"><span class="badge">PINOUT</span></div><div class="document-meta"><span id="pin-total">54 个引脚</span><span class="separator">/</span><span id="output-size">A4 · 2480 × 3508 px</span><span class="saved-state" id="save-state">已载入 P4 示例</span></div></div>
<main class="workspace">
 <aside class="sidebar">
  <nav class="tabs" aria-label="编辑面板" data-i18n-aria-label="panel.navigation"><button class="tab active" data-tab="material"><span data-i18n="panel.material">素材与画布</span></button><button class="tab" data-tab="pins"><span data-i18n="panel.pins">引脚配置</span></button><button class="tab" data-tab="style"><span data-i18n="panel.style">标签样式</span></button></nav>
  <div class="panel active" id="panel-material">
   <section><div class="section-heading"><h2><span data-i18n="image.title">产品素材</span></h2></div>
    <button class="upload-card" id="upload-image"><div class="image-thumbnail checker"><img id="source-thumbnail" alt="当前产品素材" data-i18n-alt="image.current"></div><span><strong id="source-name">WT9932P4-TINY 透明底.webp</strong><small><span data-i18n="image.replace">更换图片</span></small><span class="tag" id="alpha-tag">PNG · 透明背景</span></span><span class="upload-arrow">↥</span></button>
    
    <div class="button-row"><button class="button small" id="crop-image"><span data-i18n="image.crop">裁去透明边缘</span></button><button class="button small" id="center-image"><span data-i18n="image.center">居中素材</span></button></div>
    <label class="field-label"><span data-i18n="image.rotate">素材旋转</span></label><div class="segmented" aria-label="素材旋转" data-i18n-aria-label="image.rotate"><button data-rotation="0">0°</button><button data-rotation="90">90°</button><button data-rotation="180">180°</button><button data-rotation="270">270°</button></div><div class="field-row"><label><span data-i18n="image.x">水平位置 X</span><input id="image-x" type="number" data-state="imageX"></label><label><span data-i18n="image.y">垂直位置 Y</span><input id="image-y" type="number" data-state="imageY"></label></div>
    <label class="range-label"><span><span data-i18n="image.scale">素材缩放</span> <output id="image-scale-value">100%</output></span><input id="image-scale" type="range" min="1" max="500" step="0.1" data-state="imageScale"></label>
   </section>
   <section><div class="section-heading"><h2><span data-i18n="canvas.settings">画布设置</span></h2></div><label><span data-i18n="canvas.paper">纸张</span><select id="paper-size"><option value="portrait" data-i18n="canvas.portrait">A4 · 纵向 · 210 × 297 mm</option><option value="landscape" data-i18n="canvas.landscape">A4 · 横向 · 297 × 210 mm</option><option value="custom" data-i18n="canvas.custom">自定义</option></select></label><div class="field-row"><label><span data-i18n="canvas.width">宽度</span> <span>px</span><input id="canvas-width" type="number" min="200" max="8000" data-state="width"></label><label><span data-i18n="canvas.height">高度</span> <span>px</span><input id="canvas-height" type="number" min="200" max="8000" data-state="height"></label></div>
    <label class="field-label"><span data-i18n="canvas.background">导出背景</span></label><div class="segmented"><button class="selected" data-bg="transparent"><span class="tiny-checker"></span><span data-i18n="background.transparent">透明</span></button><button data-bg="white"><span class="tiny-white"></span><span data-i18n="background.white">白色</span></button><button data-bg="dark"><span class="tiny-dark"></span><span data-i18n="background.dark">深色</span></button></div>
    
   </section>
   <section><div class="section-heading"><h2><span data-i18n="example.title">示例</span></h2></div><button id="load-example" class="example-card"><span class="example-icon">P4</span><span><strong>WT9932P4-TINY</strong><small><span data-i18n="example.details">54 针 · 透明底素材</span></small></span><span>↗</span></button></section>
  </div>
  <div class="panel" id="panel-pins">
   <section><div class="section-heading"><h2><span data-i18n="group.title">引脚分组</span></h2><button class="text-button" id="add-group"><span data-i18n="group.add">＋ 添加</span></button></div><div id="group-tabs" class="group-tabs"></div>
    <div class="field-row group-name-row"><label><span data-i18n="group.name">分组名称</span><input id="group-name" type="text" maxlength="32"></label><button id="delete-group" class="button small danger" title="删除当前分组" data-i18n-title="group.deleteTitle"><span data-i18n="group.delete">删除组</span></button></div>
    <div class="field-row"><label><span data-i18n="group.x">起点 X</span><input id="group-x" type="number" step="1"></label><label><span data-i18n="group.y">起点 Y</span><input id="group-y" type="number" step="1"></label><label><span data-i18n="group.gap">针脚间距</span><input id="group-gap" type="number" min="1" max="2000" step="0.1"></label></div>
    <label class="range-label"><span><span data-i18n="group.scale">整组缩放</span> <output id="group-scale-value">100%</output></span><input id="group-scale" type="range" min="10" max="500" step="1"></label>
    <label class="field-label"><span data-i18n="group.alignTo">对齐到</span></label><div class="alignment-row"><select id="align-target" aria-label="对齐目标" data-i18n-aria-label="group.alignTarget"><option value="image" data-i18n="image.title">产品素材</option><option value="canvas" data-i18n="canvas.name">画布</option><option value="previous" data-i18n="group.other">另一组 PIN</option></select><button class="button small" id="align-top"><span data-i18n="align.top">顶端</span></button><button class="button small" id="align-center"><span data-i18n="align.center">居中</span></button><button class="button small" id="align-bottom"><span data-i18n="align.bottom">底端</span></button></div>
    <div class="pin-list-heading"><span><span data-i18n="pin.nameColor">名称与颜色</span></span><button class="text-button" id="reverse-pins"><span data-i18n="pin.reverse">反转顺序 ↕</span></button></div>
    <div id="pin-list" class="pin-list"></div><button id="add-pin" class="button full-width"><span data-i18n="pin.add">＋ 添加引脚</span></button>
    <details class="batch-editor"><summary><span data-i18n="pin.batch">批量编辑名称</span></summary><textarea id="batch-pins" rows="10" spellcheck="false" aria-label="批量引脚名称" data-i18n-aria-label="pin.batchNames"></textarea><button id="apply-batch" class="button small"><span data-i18n="pin.applyNames">应用名称</span></button></details>
   </section>
   <section><button id="import-config" class="button full-width"><span data-i18n="generator.import">导入 pins_pic_gen JSON</span></button></section>
  </div>
  <div class="panel" id="panel-style">
   <section><div class="section-heading"><h2><span data-i18n="style.title">文字与标签</span></h2></div><label><span data-i18n="style.font">字体</span><select id="font-family" data-state="fontFamily"><option value="Arial">Arial</option><option value="sans-serif" data-i18n="style.sans">系统无衬线</option><option value="monospace" data-i18n="style.mono">等宽字体</option></select></label><label class="range-label"><span><span data-i18n="style.fontSize">字号</span> <output id="font-size-value">70 px</output></span><input type="range" id="font-size" data-state="fontSize" min="12" max="180" step="1"></label><label class="range-label"><span><span data-i18n="style.radius">圆角程度</span> <output id="radius-value">100%</output></span><input type="range" id="radius" data-state="radius" min="0" max="100" step="1"></label><label class="toggle-row"><span><span data-i18n="style.guides">显示引线</span></span><input type="checkbox" id="guides" data-state="guides"></label></section>
   <section><div class="section-heading"><h2><span data-i18n="palette.title">快捷配色</span></h2><button class="text-button" id="auto-colors"><span data-i18n="palette.apply">应用到全部引脚</span></button></div><div class="palette-row"><label><input type="color" id="color-gpio" value="#3498db">GPIO</label><label><input type="color" id="color-power" value="#e74c3c"><span data-i18n="palette.power">电源</span></label><label><input type="color" id="color-ground" value="#2ecc71">GND</label></div></section>
   <section><div class="section-heading"><h2><span data-i18n="generator.title">生成器文件</span></h2></div><div class="button-row"><button id="export-config" class="button small"><span data-i18n="generator.export">导出配置</span></button><button id="export-base" class="button small"><span data-i18n="export.base">导出底图</span></button></div></section>
  </div>
 </aside>
 <section class="preview-area" aria-label="引脚图实时预览" data-i18n-aria-label="preview.region">
  <div class="preview-toolbar"><div class="preview-label"><span class="live-dot"></span><span data-i18n="preview.live">实时预览</span><span class="subtle" id="preview-background">透明画布</span></div><div class="preview-tools"><button class="icon-button" id="undo" title="撤销 (Ctrl/⌘ Z)" aria-label="撤销" data-i18n-aria-label="history.undo" data-i18n-title="history.undoTitle">↶</button><button class="icon-button" id="redo" title="重做" aria-label="重做" data-i18n-aria-label="history.redo" data-i18n-title="history.redo">↷</button><span class="tool-divider"></span><button class="button small" id="fit"><span data-i18n="preview.fit">适应画布</span></button><button class="button small" id="actual">100%</button></div></div>
  <div id="viewport" class="viewport"><div id="canvas-wrap" class="canvas-wrap checker"><canvas id="preview" aria-label="引脚图画布" data-i18n-aria-label="preview.canvas"></canvas><div id="selection-box" class="selection-box" hidden><span id="selection-name"></span><button data-handle="nw" aria-label="左上角缩放" data-i18n-aria-label="handle.nw"></button><button data-handle="ne" aria-label="右上角缩放" data-i18n-aria-label="handle.ne"></button><button data-handle="sw" aria-label="左下角缩放" data-i18n-aria-label="handle.sw"></button><button data-handle="se" aria-label="右下角缩放" data-i18n-aria-label="handle.se"></button><button data-handle="n" aria-label="调整顶部间距" data-i18n-aria-label="handle.n"></button><button data-handle="s" aria-label="调整底部间距" data-i18n-aria-label="handle.s"></button></div></div><div id="drop-overlay" class="drop-overlay"><strong><span data-i18n="image.drop">释放图片，开始标注</span></strong><span>PNG · JPEG · WebP</span></div></div>
  <div class="preview-bottom"><label class="snap-option"><input id="snap" type="checkbox" checked><span data-i18n="preview.snap">对齐吸附</span></label><div class="zoom-controls"><button id="zoom-out" class="icon-button" aria-label="缩小" data-i18n-aria-label="preview.zoomOut">−</button><span id="zoom-value">25%</span><button id="zoom-in" class="icon-button" aria-label="放大" data-i18n-aria-label="preview.zoomIn">＋</button></div></div>
 </section>
</main>
<dialog id="export-dialog" aria-labelledby="export-title">
 <div class="dialog-heading"><h2 id="export-title"><span data-i18n="export.image">导出图片</span></h2><button id="close-export" class="icon-button" aria-label="关闭导出" data-i18n-aria-label="export.close">×</button></div>
 <div class="export-body"><div class="export-preview checker"><img id="export-preview" alt="导出预览" data-i18n-alt="export.preview"></div><div class="export-controls">
 <label><span data-i18n="export.format">文件格式</span><select id="export-format"><option value="png">PNG</option><option value="svg">SVG</option><option value="jpg">JPG</option></select></label>
 <label><span id="export-scale-label"><span data-i18n="export.dimensions">输出尺寸</span></span><select id="export-scale"><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
 <label class="toggle-row" id="svg-optimize-row"><span><span data-i18n="export.optimize">压缩内嵌素材</span></span><input id="export-optimize" type="checkbox"></label>
 <label class="range-label" id="quality-row"><span><span id="quality-label"><span data-i18n="export.quality">图片质量</span></span><output id="export-quality-value">90%</output></span><input id="export-quality" type="range" min="10" max="100" step="1"></label>
 <label class="toggle-row"><span><span data-i18n="export.smoothing">平滑缩放</span></span><input id="export-smoothing" type="checkbox"></label>
 <p id="export-info" class="export-info" role="status"></p><p id="export-error" class="export-error" role="alert"></p>
 </div></div>
 <div class="dialog-footer"><span id="export-filename"></span><button id="save-as" class="button"><span data-i18n="export.saveAs">另存为…</span></button><button id="download-export" class="button primary"><span data-i18n="export.download">下载文件</span></button></div>
</dialog>
<div id="toast" class="toast" role="status"></div>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="project-file" type="file" accept=".json,application/json" hidden><input id="config-file" type="file" accept=".json,application/json" hidden>
<script src="defaults.js"></script><script src="src/i18n.js"></script><script src="src/model.js"></script><script src="src/export.js"></script><script src="app.js"></script>
</body></html>
